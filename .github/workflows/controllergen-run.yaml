name: controllergen-run
on:
  workflow_call:
    inputs:
      PRIMUS_REF:
        description: "The primus ref to checkout."
        required: true
        default: "main"
        type: string
      GO_VERSION:
        description: "The go version to use."
        required: false
        default: "1.22"
        type: string
      CONTROLLERGEN_VERSION:
        description: "The controller-gen version to use."
        required: false
        default: "v0.21.0"
        type: string
      CONTROLLERGEN_ARGS:
        description: "The arguments to be passed to controller-gen."
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  controllergen:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PRIMUS_APP_ID }}
          private-key: ${{ secrets.PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signoz/primus
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: go-install
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.GO_VERSION }}
      - name: info
        run: |
          $MAKE info
      - name: controllergen
        env:
          CONTROLLERGEN_VERSION: ${{ inputs.CONTROLLERGEN_VERSION }}
          CONTROLLERGEN_ARGS: ${{ inputs.CONTROLLERGEN_ARGS }}
        run: |
          $MAKE controllergen
      - name: git-diff
        run: |
          $MAKE git-diff
