name: js-tsc
on:
  workflow_call:
    inputs:
      PRIMUS_REF:
        description: "The primus ref to checkout."
        required: true
        default: "main"
        type: string
      NODE_VERSION:
        description: "The node version to use."
        required: false
        default: "22"
        type: string
      JS_SRC:
        description: "The directory path containing the js source code."
        required: true
        type: string
      JS_PKG_MANAGER:
        description: "Decide the name of the package manager to use."
        required: false
        default: 'yarn'
        type: string
      PNPM_VERSION:
        description: "The pnpm version to use."
        required: false
        default: "10"
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  js:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PRIMUS_APP_ID }}
          private-key: ${{ secrets.PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signoz/primus
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: node-install
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
      - name: install-pnpm
        if: ${{ inputs.JS_PKG_MANAGER == 'pnpm' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.PNPM_VERSION }}
      - name: type-check
        run: |
          $MAKE js-type-check SRC="$(pwd)/${{ inputs.JS_SRC }}"
        env:
          JS_PKG_MANAGER: ${{ inputs.JS_PKG_MANAGER }}
