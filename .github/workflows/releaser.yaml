name: releaser

on:
  workflow_call:
    inputs:
      PRIMUS_REF:
        description: 'The primus ref to checkout.'
        required: true
        default: 'main'
        type: string
      PROJECT_NAME:
        description: 'The name of the project to release.'
        required: true
        default: 'signoz'
        type: string
      RELEASE_TYPE:
        description: 'The type of release to create.'
        required: true
        default: 'minor'
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  signoz:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
      pull-requests: 'write'
    steps:
      - name: self-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PRIMUS_APP_ID }}
          private-key: ${{ secrets.PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signoz/primus
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: git-configure
        run: |
          git config --global user.name "primus-bot[bot]"
          git config --global user.email "171087277+primus-bot[bot]@users.noreply.github.com"
      - name: info
        run: |
          $MAKE info
      - name: releaser
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          $MAKE releaser RELEASER_ARGS="-p ${{ inputs.PROJECT_NAME }} -t ${{ inputs.RELEASE_TYPE }}"
