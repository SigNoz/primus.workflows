name: kustomize-lint

on:
  workflow_call:
    inputs:
      GITHUB_ENVIRONMENT:
        description: 'The environment to run the Primus GitHub operation in.'
        default: 'production'
        type: string
      PRIMUS_REF:
        description: 'The primus ref to checkout.'
        required: true
        default: 'main'
        type: string
      KUSTOMIZE_ARGS:
        description: 'Extra arguments for kustomize.sh (e.g. "-s"). A -d here takes precedence over the directories computed from the pull request.'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  kustomize:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: targets
        name: kustomize-targets
        env:
          ARGS: ${{ inputs.KUSTOMIZE_ARGS }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs=""
          if [[ " ${ARGS} " == *" -d "* ]]; then
            echo "Directories given in KUSTOMIZE_ARGS; using those"
          elif [[ "${EVENT}" != "pull_request" ]]; then
            echo "Not a pull request; linting whole repo"
          else
            changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            echo "Changed files:"
            echo "${changed}"

            # Bases are shared by many overlays, so a change to one lints everything.
            if grep -qE '(^|/)bases?/' <<<"${changed}"; then
              echo "Base changed; linting whole repo"
            else
              # Lint the nearest kustomization above each changed file.
              dirs=$(while IFS= read -r file; do
                dir=$(dirname "${file}")
                while [[ "${dir}" != "." && ! -f "${dir}/kustomization.yaml" ]]; do
                  dir=$(dirname "${dir}")
                done
                if [[ -f "${dir}/kustomization.yaml" ]]; then
                  echo "${dir}"
                fi
              done <<<"${changed}" | sort -u | xargs)

              if [[ -z "${dirs}" ]]; then
                echo "No kustomizations affected; skipping lint"
                echo "skip=true" >> "${GITHUB_OUTPUT}"
              else
                echo "Linting: ${dirs}"
              fi
            fi
          fi
          echo "dirs=${dirs}" >> "${GITHUB_OUTPUT}"
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.GITHUB_ENVIRONMENT == 'production' && secrets.PRIMUS_APP_ID || secrets.NP_PRIMUS_APP_ID }}
          private-key: ${{ inputs.GITHUB_ENVIRONMENT == 'production' && secrets.PRIMUS_PRIVATE_KEY || secrets.NP_PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@v4
        with:
          repository: signoz/primus
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: info
        run: |
          $MAKE info
      - name: kustomise-cli
        run: |
          which kustomize
          kustomize version
      - name: kustomize-lint
        if: steps.targets.outputs.skip != 'true'
        env:
          ARGS: ${{ inputs.KUSTOMIZE_ARGS }}
          DIRS: ${{ steps.targets.outputs.dirs }}
        run: |
          $MAKE kustomize-lint KUSTOMIZE_ARGS="${DIRS:+-d ${DIRS} }${ARGS}"
