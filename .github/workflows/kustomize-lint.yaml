name: kustomize-lint

on:
  workflow_call:
    inputs:
      GITHUB_ENVIRONMENT:
        description: 'The environment to run the Primus GitHub operation in.'
        default: 'production'
        type: string
      PRIMUS_REF:
        description: 'The primus ref to checkout.'
        required: true
        default: 'main'
        type: string
      KUSTOMIZE_ARGS:
        description: 'Extra arguments for kustomize.sh (e.g. "-s"). A -d here takes precedence over the directories computed from the pull request.'
        required: false
        default: ''
        type: string

defaults:
  run:
    shell: bash

env:
  PRIMUS_HOME: .primus
  MAKE: make --no-print-directory --makefile=.primus/src/make/main.mk

jobs:
  kustomize:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: token
        name: github-token-gen
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.GITHUB_ENVIRONMENT == 'production' && secrets.PRIMUS_APP_ID || secrets.NP_PRIMUS_APP_ID }}
          private-key: ${{ inputs.GITHUB_ENVIRONMENT == 'production' && secrets.PRIMUS_PRIVATE_KEY || secrets.NP_PRIMUS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: primus-checkout
        uses: actions/checkout@v4
        with:
          repository: signoz/primus
          ref: ${{ inputs.PRIMUS_REF }}
          path: .primus
          token: ${{ steps.token.outputs.token }}
      - name: info
        run: |
          $MAKE info
      - name: kustomise-cli
        run: |
          which kustomize
          kustomize version
      - id: targets
        name: kustomize-targets
        env:
          # The shas are empty outside pull requests, so the whole repo is targeted. A -d from the caller wins.
          KUSTOMIZE_ARGS: -b "${{ github.event.pull_request.base.sha }}" -H "${{ github.event.pull_request.head.sha }}" ${{ inputs.KUSTOMIZE_ARGS }}
        run: |
          dirs=$($MAKE kustomize-targets)
          echo "dirs=${dirs}" >> "${GITHUB_OUTPUT}"
      - name: kustomize-lint
        if: steps.targets.outputs.dirs != ''
        env:
          # The targets go last so they replace any -d from the caller; kustomize-targets already honours it.
          KUSTOMIZE_ARGS: ${{ inputs.KUSTOMIZE_ARGS }} -d ${{ steps.targets.outputs.dirs }}
        run: |
          $MAKE kustomize-lint
